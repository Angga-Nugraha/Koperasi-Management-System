# ============================================
# HTTP — development / certbot challenge
# ============================================
server {
  listen 80;
  listen [::]:80;
  server_name _;

  limit_req zone=api burst=20 nodelay;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  include /etc/nginx/conf.d/locations.conf;
}

