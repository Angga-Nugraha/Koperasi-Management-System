volumes:
  mysql_data:
  backups:
  certbot_www:

networks:
  simko:
    driver: bridge

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-simko_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-simko}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simko

  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-simko_secret}@mysql:3306/${MYSQL_DATABASE:-simko}
      AUTH_SECRET: ${AUTH_SECRET:?required}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      TZ_OFFSET: ${TZ_OFFSET:-+07:00}
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: >
      sh -c "
        npx prisma migrate deploy &&
        npx prisma db seed --skip-generate || true &&
        node server.js
      "
    networks:
      - simko

  nginx:
    image: nginx:1.26-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP:-80}:80"
      - "${NGINX_HTTPS:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security.conf:/etc/nginx/security.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/locations.conf:/etc/nginx/conf.d/locations.conf:ro
      - certbot_www:/var/www/certbot
    depends_on:
      - app
    networks:
      - simko

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - ./nginx/certbot:/etc/letsencrypt
    entrypoint: >
      sh -c "
        trap exit TERM;
        while true; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 43200;
        done
      "
    networks:
      - simko

  backup:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-simko_secret}
    volumes:
      - backups:/backups
    entrypoint: >
      sh -c "
        while true; do
          sleep 86400 &&
          mysqldump -h mysql -u root --single-transaction --routines --triggers simko > /backups/simko_\$(date +%Y%m%d).sql &&
          find /backups -name 'simko_*.sql' -mtime +30 -delete
        done
      "
    depends_on:
      - mysql
    networks:
      - simko
